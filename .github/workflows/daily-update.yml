name: Daily OKVED2 Update

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 МСК
  workflow_dispatch:

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKVED2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI с поддержкой API-токенов (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python -c "import re, subprocess; out = subprocess.check_output(['kaggle','--version'], text=True).strip(); m = re.search(r'(\d+)\.(\d+)', out); assert m and tuple(map(int, m.groups())) >= (1, 8), f'нужен kaggle CLI >= 1.8.0, получен: {out}'; print('OK: kaggle CLI поддерживает API-токены')"

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okved2-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -30

      - name: Determine SRC (авто-детект пути web/)
        run: |
          SRC=""
          for cand in ./output/web ./output/okved2_data/web ./output; do
            if [ -f "$cand/okved2.json" ]; then
              SRC="$cand"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::error::okved2.json не найден в ./output/web, ./output/okved2_data/web, ./output"
            exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "✅ SRC=$SRC"

      - name: Copy web files to repo root (не падает, ставит флаг)
        id: copy
        run: |
          MISSING=0
          for f in okved2.json okved2.json.gz okved2_meta.json okved2_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f"
            else
              echo "::warning::MISSING $f в $SRC (тетрадка, вероятно, упала)"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 4 файлов — коммит пропущен"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Все 4 файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Determine SOURCE_DATE (одной строкой, цепочкой or)
        if: env.FILES_OK == 'true'
        run: |
          SOURCE_DATE=$(python -c "import json; m=json.load(open('okved2_meta.json', encoding='utf-8')); print(m.get('source_date') or m.get('effective_date') or m.get('prepared_date') or (m.get('generated_at') or '')[:10] or '?')")
          echo "SOURCE_DATE=$SOURCE_DATE" >> "$GITHUB_ENV"
          echo "SOURCE_DATE=$SOURCE_DATE"

      - name: Check metadata (publish_allowed / critical_errors)
        if: env.FILES_OK == 'true'
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open('okved2_meta.json', encoding='utf-8'))
          pa = m.get('publish_allowed')
          ce = m.get('critical_errors') or []
          wr = m.get('warnings') or []
          if pa is not True:
              print(f"::error::publish_allowed={pa}")
              sys.exit(1)
          if ce:
              print(f"::error::critical_errors={ce}")
              sys.exit(1)
          print(f"✓ Мета OK: publish_allowed={pa}, critical_errors={len(ce)}, warnings={len(wr)}")
          EOF
          echo "META_OK=true" >> "$GITHUB_ENV"

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okved2.json okved2.json.gz okved2_meta.json okved2_meta.json.gz
          if git diff --cached --quiet; then
            echo "✅ Изменений нет — данные уже актуальны"
          else
            git commit -m "chore(data): auto-update OKVED2 ${SOURCE_DATE}"
            git push
            echo "✅ Изменения запушены (SOURCE_DATE=${SOURCE_DATE})"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okved2-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "✅ Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"